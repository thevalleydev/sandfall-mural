<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1e2b" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'><rect width='4' height='2' fill='%238ccff0'/><rect y='2' width='4' height='2' fill='%23f6cf45'/></svg>" />
    <title>Sandfall Mural (prototype)</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="btn-levels" class="icon" aria-label="Levels and playtest log">☰</button>
        <div id="level-title"></div>
        <select id="rule-select" aria-label="Reach rule"></select>
        <button id="btn-sound" class="icon" aria-label="Sound on">🔊</button>
        <button id="btn-restart" class="icon" aria-label="Restart level">↻</button>
      </header>
      <main id="stage">
        <canvas id="board"></canvas>
        <canvas id="overlay"></canvas>
      </main>
      <div id="hud"><span id="hud-score"></span><span id="belt-count"></span></div>
      <section id="slots" aria-label="Holding slots"></section>
      <section id="lanes" aria-label="Waiting collectors"></section>
      <div id="modal" hidden><div id="modal-card"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
